<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot {{ hr_team_name or "Atención" }} - {{ company_name or "Empresa" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("rrhh_panel_theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <main class="chat-wrapper">
      <header class="chat-header">
        <h1>Asistente Virtual {{ hr_team_name or "Atención" }}</h1>
        <p>Entorno de prueba previo a WhatsApp</p>
      </header>

      <section id="chat-window" class="chat-window" aria-live="polite"></section>

      <section class="quick-actions">
        <button id="btn-menu" type="button">Ver menú</button>
        <button id="btn-reset" type="button" class="secondary">Reiniciar chat</button>
      </section>

      <form id="chat-form" class="chat-form">
        <input
          id="message-input"
          type="text"
          autocomplete="off"
          placeholder="Escribí tu consulta..."
          required
        />
        <button id="send-button" type="submit">Enviar</button>
      </form>

      <section id="dynamic-actions" class="dynamic-actions"></section>

      <p id="feedback-hint" class="feedback-hint"></p>
    </main>

    <script>
      const chatWindow = document.getElementById("chat-window");
      const chatForm = document.getElementById("chat-form");
      const messageInput = document.getElementById("message-input");
      const feedbackHint = document.getElementById("feedback-hint");
      const btnMenu = document.getElementById("btn-menu");
      const btnReset = document.getElementById("btn-reset");
      const dynamicActions = document.getElementById("dynamic-actions");
      const initialQuickActions = {{ quick_actions_iniciales|tojson }};
      const initialBienvenida = {{ bienvenida|tojson }};
      let handoffActive = false;
      let pollTimer = null;
      const HANDOFF_POLL_MS = 60 * 1000;

      function addMessage(role, text) {
        const bubble = document.createElement("article");
        bubble.className = `message ${role}`;
        bubble.textContent = text;
        chatWindow.appendChild(bubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function renderQuickActions(actions) {
        dynamicActions.innerHTML = "";
        if (!Array.isArray(actions) || actions.length === 0) return;

        actions.forEach((action) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `chip ${action.variant || "default"}`;
          btn.textContent = action.label;
          btn.addEventListener("click", () =>
            sendMessage(action.value, { displayText: action.label })
          );
          dynamicActions.appendChild(btn);
        });
      }

      function formatIncomingHandoffMessage(msg) {
        if (!msg || !msg.texto) return "";
        const remitente = (msg.remitente || "").toLowerCase();
        if (remitente === "rrhh") {
          return `👩‍💼 Agente${msg.agente ? ` (${msg.agente})` : ""}: ${msg.texto}`;
        }
        if (remitente === "sistema") {
          return `ℹ️ ${msg.texto}`;
        }
        return msg.texto;
      }

      function setHandoffPolling(active) {
        handoffActive = Boolean(active);
        if (!handoffActive && pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
          return;
        }

        if (handoffActive && !pollTimer) {
          pollTimer = setInterval(pollHandoffMessages, HANDOFF_POLL_MS);
        }
      }

      async function pollHandoffMessages() {
        if (!handoffActive) return;
        try {
          const response = await fetch("/api/chat/poll");
          const data = await response.json();
          if (!data.ok) return;

          const incoming = Array.isArray(data.messages) ? data.messages : [];
          incoming.forEach((msg) => {
            const formatted = formatIncomingHandoffMessage(msg);
            if (formatted) addMessage("bot", formatted);
          });

          if (incoming.length > 0 && Array.isArray(data.quick_actions)) {
            renderQuickActions(data.quick_actions);
          }

          setHandoffPolling(Boolean(data.handoff_active));
        } catch (error) {
          // Si falla un poll puntual, no rompemos la UI.
        }
      }

      async function sendMessage(message, options = {}) {
        const { skipRenderUser = false, displayText = null } = options;
        const trimmed = message.trim();
        if (!trimmed) return;

        if (!skipRenderUser) {
          addMessage("user", displayText || trimmed);
        }

        messageInput.value = "";
        messageInput.focus();

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: trimmed }),
          });

          const contentType = response.headers.get("Content-Type") || "";
          if (!contentType.includes("application/json")) {
            addMessage("bot", "El servidor respondió con un error. Revisá que la aplicación esté corriendo y probá de nuevo.");
            feedbackHint.textContent = "";
            renderQuickActions([]);
            return;
          }

          const data = await response.json();
          if (!data.ok) {
            addMessage("bot", data.error || "Hubo un error procesando tu mensaje.");
            feedbackHint.textContent = "";
            renderQuickActions([]);
            return;
          }

          addMessage("bot", data.reply);
          feedbackHint.textContent = data.await_feedback
            ? "Esperando feedback: respondé si/no, o escribí otra consulta."
            : "";
          renderQuickActions(data.quick_actions || []);
          setHandoffPolling(Boolean(data.handoff_active));
        } catch (error) {
          const msg = (error && error.message) ? error.message : "";
          const isNetwork = /failed to fetch|network|load/i.test(msg);
          addMessage("bot", isNetwork || !msg
            ? "No pude conectarme con el servidor del chatbot. Revisá que la aplicación esté corriendo (por ejemplo ejecutando 'python web_chat.py') y probá de nuevo."
            : "Error: " + msg);
          feedbackHint.textContent = "";
          renderQuickActions([]);
        }
      }

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(messageInput.value);
      });

      btnMenu.addEventListener("click", () =>
        sendMessage("menu", { displayText: "Ver menú" })
      );
      btnReset.addEventListener("click", async () => {
        try {
          const response = await fetch("/api/reset", { method: "POST" });
          const data = await response.json();
          chatWindow.innerHTML = "";
          addMessage("bot", data.reply || initialBienvenida);
          feedbackHint.textContent = "";
          renderQuickActions(data.quick_actions || initialQuickActions);
          setHandoffPolling(Boolean(data.handoff_active));
        } catch (error) {
          addMessage("bot", "No se pudo reiniciar la sesión.");
        }
      });

      addMessage("bot", initialBienvenida);
      addMessage("bot", "Escribí tu consulta o tocá 'Ver menú' para empezar.");
      renderQuickActions(initialQuickActions);
      setHandoffPolling(false);
      messageInput.focus();
    </script>
  </body>
</html>
