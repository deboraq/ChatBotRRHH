<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingreso RRHH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
  </head>
  <body>
    <main class="login-wrapper">
      <section class="login-card">
        <h1>Ingreso de RRHH</h1>
        <p>Acceso al panel de conversaciones e historial.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next_path }}" />

          <label for="company_id">Empresa</label>
          <select id="company_id" name="company_id" required>
            {% for company in companies %}
            <option
              value="{{ company.company_id }}"
              {% if company.company_id == selected_company %}selected{% endif %}
            >
              {{ company.company_name }}{% if company.branches %} ({{ company.branches|length }} suc.){% endif %}
            </option>
            {% endfor %}
          </select>

          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required />

          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Ingresar</button>
        </form>
        <p class="hint">
          ¿Olvidaste tu contraseña?
          <a href="/recuperar-clave">Restablecela por email</a>.
        </p>
      </section>
    </main>
  </body>
</html>
