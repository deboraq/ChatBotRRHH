<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente {{ hr_team_name or "Atención" }} - {{ company_name or "Empresa" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}" />
    <style>
      /* Layout principal: sidebar + contenido */
      .app-layout {
        display: flex;
        min-height: 100vh;
        background: #f3f4f6;
      }
      .app-sidebar {
        width: 220px;
        min-width: 220px;
        background: #fff;
        border-right: 1px solid #e5e7eb;
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: 2px 0 8px rgba(0,0,0,0.04);
      }
      .app-sidebar h2 {
        margin: 0 0 12px;
        padding: 0 16px;
        font-size: 1rem;
        font-weight: 600;
        color: #374151;
      }
      .app-sidebar p.subtle {
        margin: 0 0 12px;
        padding: 0 16px;
        font-size: 0.8rem;
        color: #6b7280;
      }
      .app-module-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px 16px;
        border: none;
        background: transparent;
        color: #374151;
        font-size: 0.9rem;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: background 0.15s, color 0.15s;
      }
      .app-module-btn:hover {
        background: #f3f4f6;
        color: #1f2937;
      }
      .app-module-btn.active {
        background: #eff6ff;
        color: #1d4ed8;
        border-left-color: #2563eb;
        font-weight: 500;
      }
      .app-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .app-frame {
        flex: 1;
        width: 100%;
        min-height: 100vh;
        border: none;
        background: #fff;
      }
      @media (max-width: 640px) {
        .app-layout {
          flex-direction: column;
        }
        .app-sidebar {
          width: 100%;
          min-width: 0;
          flex-direction: row;
          flex-wrap: wrap;
          padding: 8px;
          gap: 8px;
        }
        .app-sidebar h2,
        .app-sidebar p.subtle {
          width: 100%;
          margin: 0;
          padding: 0 8px;
        }
        .app-module-btn {
          flex: 1 1 auto;
          min-width: 100px;
          border-left: none;
          border-bottom: 3px solid transparent;
        }
        .app-module-btn.active {
          border-left: none;
          border-bottom-color: #2563eb;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="app-sidebar">
        <h2>Módulos</h2>
        <p class="subtle">Seleccioná qué querés usar.</p>
        <button type="button" class="app-module-btn active" data-module="chat" data-src="/chat">
          Asistente (Chat)
        </button>
        <button type="button" class="app-module-btn" data-module="rrhh" data-src="/rrhh">
          Panel de atención
        </button>
        <button type="button" class="app-module-btn" data-module="configuracion" data-src="/configuracion">
          Configuración
        </button>
        <button type="button" class="app-module-btn" data-module="estadisticas" data-src="/estadisticas">
          Estadísticas
        </button>
        <button type="button" class="app-module-btn" data-module="preferencias" data-src="/preferencias">
          Preferencias
        </button>
        <button type="button" class="app-module-btn" data-module="historial" data-src="/historial">
          Historial
        </button>
      </aside>
      <main class="app-main">
        <iframe
          id="app-frame"
          class="app-frame"
          title="Contenido del módulo"
          src="/chat"
        ></iframe>
      </main>
    </div>
    <script>
      (function() {
        const frame = document.getElementById("app-frame");
        const buttons = document.querySelectorAll(".app-module-btn[data-src]");
        buttons.forEach(function(btn) {
          btn.addEventListener("click", function() {
            const src = this.getAttribute("data-src");
            var framePath = frame.src ? new URL(frame.src).pathname : "";
            if (!src || framePath === src) return;
            buttons.forEach(function(b) { b.classList.remove("active"); });
            this.classList.add("active");
            frame.src = src;
          });
        });
      })();
    </script>
  </body>
</html>
